<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青鬼AR — インストール</title>
<style>
  :root{color-scheme:light dark;--bg:#f7f7f8;--fg:#15161a;--sub:#6a6d78;--card:#fff;--line:#e3e4e8}
  @media (prefers-color-scheme:dark){:root{--bg:#111216;--fg:#f2f3f5;--sub:#9b9fab;--card:#1c1e24;--line:#2c2f37}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
        padding:32px 24px;max-width:420px;width:100%;text-align:center}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:.02em}
  .ver{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:24px}
  a.btn{display:block;background:#2a5cdc;color:#fff;text-decoration:none;
        padding:17px;border-radius:13px;font-weight:600;font-size:17px}
  a.btn:active{opacity:.75}
  ul{text-align:left;color:var(--sub);font-size:13.5px;margin:22px 0 0;padding-left:1.2em}
  li{margin:6px 0}
</style></head><body>
<div class="card">
  <h1>青鬼AR</h1>
  <div class="ver">v0.2.1 (build 4) · 接地影と6DoF確認用の杭</div>
  <a class="btn" href="itms-services://?action=download-manifest&amp;url=https://yozzzo.github.io/aooni-ar-dist/manifest.plist">
    インストール
  </a>
  <ul>
    <li><b>Safari で開くこと。</b>他のブラウザでは動きません</li>
    <li>登録済みの iPhone にのみインストールできます</li>
    <li>iOS 18.0 以降</li>
    <li>初回は「設定 → 一般 → VPN とデバイス管理」で開発元を信頼</li>
    <li>青い箱が青鬼の仮置きです。手を近づけると退きます</li>
  </ul>
</div></body></html>
